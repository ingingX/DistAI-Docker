---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: distai
  labels:
    app: coordinator
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: coordinator

---
apiVersion: v1
kind: Service
metadata:
  name: bert-worker
  namespace: distai
  labels:
    app: bert-worker
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 9001
    targetPort: 9001
    protocol: TCP
  selector:
    app: bert-worker

---
apiVersion: v1
kind: Service
metadata:
  name: mobilenet-worker
  namespace: distai
  labels:
    app: mobilenet-worker
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 9002
    targetPort: 9002
    protocol: TCP
  selector:
    app: mobilenet-worker

---
apiVersion: v1
kind: Service
metadata:
  name: clip-worker
  namespace: distai
  labels:
    app: clip-worker
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 9003
    targetPort: 9003
    protocol: TCP
  selector:
    app: clip-worker

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bert-worker-hpa
  namespace: distai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bert-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mobilenet-worker-hpa
  namespace: distai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mobilenet-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clip-worker-hpa
  namespace: distai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clip-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: distai
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coordinator-from-ingress
  namespace: distai
spec:
  podSelector:
    matchLabels:
      app: coordinator
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coordinator-to-workers
  namespace: distai
spec:
  podSelector:
    matchLabels:
      worker-type: bert
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: coordinator
    ports:
    - protocol: TCP
      port: 9001
