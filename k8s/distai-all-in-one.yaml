apiVersion: v1
kind: Namespace
metadata:
  name: distai
  labels:
    name: distai

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: distai-app
  namespace: distai

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: distai-role
  namespace: distai
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: distai-rolebinding
  namespace: distai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: distai-role
subjects:
- kind: ServiceAccount
  name: distai-app
  namespace: distai

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: distai-config
  namespace: distai
data:
  MAX_RETRIES: "3"
  RETRY_BACKOFF: "0.5"
  HEALTH_CHECK_INTERVAL: "5"
  REQUEST_TIMEOUT: "10"
  LOG_LEVEL: "INFO"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: distai
  labels:
    app: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: distai-app
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - coordinator
              topologyKey: kubernetes.io/hostname
      containers:
      - name: coordinator
        image: distai-coordinator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        envFrom:
        - configMapRef:
            name: distai-config
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 30
          periodSeconds: 1
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bert-worker
  namespace: distai
  labels:
    app: bert-worker
    worker-type: bert
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bert-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bert-worker
        worker-type: bert
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9001"
    spec:
      serviceAccountName: distai-app
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: worker-type
                  operator: In
                  values:
                  - bert
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: model-loader
        image: distai-bert-worker:latest
        command: ["/bin/sh", "-c"]
        args:
        - echo "Initializing BERT worker..." && sleep 2
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
      containers:
      - name: bert-worker
        image: distai-bert-worker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9001
          protocol: TCP
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        env:
        - name: WORKER_ID
          value: bert-worker
        - name: WORKER_PORT
          value: "9001"
        readinessProbe:
          httpGet:
            path: /status
            port: 9001
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /status
            port: 9001
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface
      volumes:
      - name: model-cache
        emptyDir:
          sizeLimit: 2Gi
      terminationGracePeriodSeconds: 30

